server:
  port: 8080

spring:
  application:
    name: travel-guide-mvp
  datasource:
    url: jdbc:h2:file:./data/travel-guide;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

travel:
  ai:
    api-key: ${TRAVEL_AI_API_KEY:}
    model: ${TRAVEL_AI_MODEL:gpt-4o-mini}
  map:
    amap-key: ${AMAP_WEB_KEY:}

logging:
  level:
    com.travelguide: INFO

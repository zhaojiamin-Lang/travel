spring:
  application:
    name: travel-guide-mvp-test
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  datasource:
    url: jdbc:h2:mem:travel-guide-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      repositories:
        enabled: false

travel:
  ai:
    api-key: ""
    model: qwen-plus
    embedding-model: text-embedding-v3
    base-url: https://dashscope.aliyuncs.com/compatible-mode
  map:
    amap-key: ""
    amap-service-key: ""
  weathercn:
    api-key: ""
    base-url: https://openapi.weathercn.com
  memory:
    mongodb:
      uri: ""
      database: travel_memory
  rag:
    knowledge-path: ../knowledge
    embedding-cache-enabled: false
    pgvector-enabled: false
    answer-cache-enabled: false

logging:
  level:
    com.travelguide: INFO

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travel_guide
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
    ports:
      - "5432:5432"
    volumes:
      - travel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_guide"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  travel_pg_data:
